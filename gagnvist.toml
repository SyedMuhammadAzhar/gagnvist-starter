# Shared settings of the gagnvist starter kit: the same for everyone, set by the
# organizers. Your personal settings (JURECA username, SSH key, team key) do not belong
# here: copy example.env to .env and fill it in. .env is never committed.
#
# This edition of the starter kit runs on JURECA, at the Jülich Supercomputing Centre
# (the LUMI edition is the main branch of the repository). See docs/jureca.md.

[jureca]
host = "jureca.fz-juelich.de"
project = "training2654"                 # the hackathon's project on JURECA (JuDoor)
# The software that model jobs run in: vLLM's own image, pulled with apptainer.
container = "/p/project1/training2654/azhar1/gagnvist/containers/vllm-openai-v0.32.0.sif"
local_port = 8775                        # port on your computer for the tunnel to JURECA
gateway_user = "azhar1"                  # who runs the shared models on JURECA
gateway_job = "gagnvist-gateway"         # the name of that job
gateway_port = 4000                      # the port it listens on inside JURECA

[models]
chat = "qwen2.5-7b"                      # the shared language model
embeddings = "bge-m3"                    # the shared embedding model

[data]
folder = "data"                          # where `gagnvist get-data` unpacks the data
# The data zip comes with the repository, in pieces: data-release/<name>.zip.part01, ...
archive = "data-release/gagnvist-pxweb-data-2026-10-18.zip"
sha256 = "de4ae9e50e990804a170e2a1a722b29acade4059120faeaffc001859bc38883a"
download_url = ""                        # only if the zip is published elsewhere instead

[search]
index = "index"                          # the vector index used to find tables (see README)
cards = "cards"                          # the table cards, both languages (see cards/README.md)
