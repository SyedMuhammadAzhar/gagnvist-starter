# Shared settings of the gagnvist starter kit: the same for everyone, set by the
# organizers. Your personal settings (LUMI username, SSH key, team key) do not belong
# here: copy example.env to .env and fill it in. .env is never committed.

[lumi]
host = "lumi.csc.fi"
project = "project_000000000"            # the hackathon's LUMI project
# The software that model jobs run in: a container of the LUMI AI Factory.
container = "/appl/local/laifs/containers/lumi-multitorch-u24r70f21m50t210-20260415_130625/lumi-multitorch-full-u24r70f21m50t210-20260415_130625.sif"

[shared_services]
local_port = 8765                        # port on your computer for the tunnel to LUMI
gateway_user = "organizer_username"      # who runs the shared models on LUMI
gateway_job = "gagnvist-gateway"         # the name of that job
gateway_port = 4000                      # the port it listens on inside LUMI

[models]
chat = "qwen2.5-7b"                      # the shared language model on LUMI
embeddings = "bge-m3"                    # the shared embedding model on LUMI

[data]
folder = "data"                          # where the data is kept on this computer
download_url = ""                        # address of the data zip
sha256 = ""                              # checksum of the data zip

[search]
index = "index"                          # the vector index used to find tables (see README)
