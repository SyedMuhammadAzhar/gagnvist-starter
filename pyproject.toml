[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gagnvist"
version = "0.1.0"
description = "Starter kit for the GAGNVÍST 2026 hackathon: answer questions from Statistics Iceland's tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",    # HTTP requests to the data download and the model servers
    "numpy>=1.26,<3",    # vector search over the table index
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gagnvist = "gagnvist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gagnvist = ["py.typed", "lumi/job_templates/*.sbatch", "lumi/job_templates/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # likely bugs
    "UP",       # modern Python syntax
    "SIM",      # simpler code
    "RUF",      # ruff's own checks
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
exclude = ["job_templates/"]  # scripts that run on the supercomputer, where PyTorch is installed

[tool.pytest.ini_options]
testpaths = ["tests"]
